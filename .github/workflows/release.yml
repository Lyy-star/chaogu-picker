name: Release

# 打标签（例如 v0.1.0）时自动打包 Windows 安装包并发布到 GitHub Releases：
#   git tag v0.1.0 && git push origin v0.1.0
# 也可以在 Actions 页面手动触发（workflow_dispatch），这时只打包、不发 Release，
# 产物作为 Artifact 上传，方便先本地验收。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成图标（LYY 字标）
        run: npm run icon

      - name: 打包并发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: 打包（手动触发，不发 Release）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: chaogu-picker-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
          if-no-files-found: warn
